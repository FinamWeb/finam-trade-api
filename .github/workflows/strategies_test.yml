name: Python strategy tests

on:
  push:
    branches: ["main"]
    paths:
      - "strategies/**"
      - ".github/workflows/strategies_test.yml"
  pull_request:
    paths:
      - "strategies/**"
      - ".github/workflows/strategies_test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor, not 3.9: the finam-sdk wheel ships proto stubs
        # generated with protobuf gencode 7.35, which won't load on a protobuf
        # runtime below 7.x, and protobuf 7.x requires Python >= 3.10.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # The examples install the SDK from PyPI rather than sdk/python, so they
      # exercise the same package end users get — including the generated proto
      # stubs shipped in the wheel, which are gitignored in this repo.
      - name: Install published SDK and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r strategies/requirements.txt

      - name: Run strategy tests
        run: python -m pytest strategies/sma_crossover/tests

      - name: Lint strategy
        run: |
          python -m ruff check strategies
          python -m ruff format --check strategies

      - name: Type-check strategy
        if: matrix.python-version == '3.13'
        run: python -m mypy --config-file strategies/pyproject.toml strategies/sma_crossover
