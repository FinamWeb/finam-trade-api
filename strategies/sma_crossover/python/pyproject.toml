# Tool configuration only. This example is not packaged or published — it is a
# self-contained directory meant to be copied out and run against the SDK
# installed from PyPI (see requirements.txt).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "skip"
ignore_missing_imports = true
exclude = ["tests/"]
